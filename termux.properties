extra-keys = [[{"key":"DRAWER","popup":"KEYBOARD"},{"key":"TAB","popup":{"macro":"SHIFT TAB","display":"s-tab"}},{"key":"CTRL","display":"ctr","popup":"alt"},{"key":"~","popup":"|"},{"key":"ESC","popup":{"macro":"CTRL c","display":"c-c"}},{"key":"/","popup":{"macro":"CTRL u nx SPACE oracle:\n","display":"orcl"}},{"macro":"CTRL u clear\n","display":"cl","popup":{"macro":"CTRL u exit\n","display":"ext"}},{"key":"PASTE","display":"p","popup":{"macro":"CTRL u portal\n","display":"portal"}},{"key":"LEFT","display":"←","popup":{"key":"HOME","display":"home"}},{"key":"DOWN","display":"↓","popup":{"key":"UP","display":"↑"}},{"key":"RIGHT","display":"→","popup":{"key":"END","display":"end"}}]]
bell-character = ignore

# ── Quality-of-life ──
# Enables the socket server used by fast `am` (termux-am-socket).
run-termux-am-socket-server = true
# Suppress the "session N of M" toast on every tab swap.
disable-terminal-session-change-toast = true
# Bigger scrollback (default 2000, max 50000).
terminal-transcript-rows = 10000
# Cleaner first-frame when opening/resuming a session.
hide-soft-keyboard-on-startup = true
# Back button → ESC (kinder to vim/less mishits vs. quitting Termux).
back-key = escape
# New sessions land in the repo dir — makes `install.sh` / `ter update` reflex.
default-working-directory = /data/data/com.termux/files/home/ter
